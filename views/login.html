<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema IDS/IPS</title>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">IDS</div>
        <h1>Sistema IDS/IPS</h1>
        <p>Detección y Prevención de Intrusiones</p>
      </div>

      <form id="form-login">
        <div class="form-group">
          <label for="username">Usuario</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="Ingresa tu usuario"
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Ingresa tu contraseña"
              required
              autocomplete="current-password"
            >
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-submit">
          Iniciar Sesión
        </button>

        <div id="mensaje" class="alert"></div>
      </form>

      <div class="footer-text">
        <p>Credenciales por defecto: <strong>admin / admin123</strong></p>
      </div>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
